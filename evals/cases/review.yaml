# Each case is a ready-made diff. `bug: true` means the diff has a real defect a reviewer should block on;
# `bug: false` means it is correct and blocking it is a false alarm.
- id: bug-wrong-item-marked
  bug: true
  title: "Fix: `done` marks the wrong item after deletions"
  description: "Items can be missing from the middle of the list once clear exists. `done` must match on the item's id, not its position."
  diff: |
    diff --git a/todo/store.py b/todo/store.py
    --- a/todo/store.py
    +++ b/todo/store.py
    @@ -17,12 +17,10 @@ class Store:
             return new_id
     
         def done(self, item_id: int) -> None:
    -        for item in self.items:
    -            if item["id"] == item_id:
    -                item["done"] = True
    -                self._save()
    -                return
    -        raise KeyError(item_id)
    +        if item_id - 1 < len(self.items):
    +            self.items[item_id - 1]["done"] = True
    +            self._save()
    +            return
    +        raise KeyError(item_id)
     
         def list(self) -> list[dict]:
             return list(self.items)

- id: bug-shell-injection
  bug: true
  title: "Add `export` command that writes the list to a file via the shell"
  description: "`python -m todo.cli export <name>` should save the list to <name>.txt."
  diff: |
    diff --git a/todo/cli.py b/todo/cli.py
    --- a/todo/cli.py
    +++ b/todo/cli.py
    @@ -1,5 +1,6 @@
     import argparse
    +import os
     import sys
     
     from .store import Store
    @@ -12,6 +13,8 @@ def main(argv: list[str] | None = None) -> int:
         a.add_argument("title")
         d = sub.add_parser("done")
         d.add_argument("id", type=int)
    +    e = sub.add_parser("export")
    +    e.add_argument("name")
         args = p.parse_args(argv)
     
         store = Store(args.file)
    @@ -19,6 +22,9 @@ def main(argv: list[str] | None = None) -> int:
             print(store.add(args.title))
         elif args.cmd == "done":
             store.done(args.id)
    +    elif args.cmd == "export":
    +        lines = "\n".join(i["title"] for i in store.list())
    +        os.system(f"echo '{lines}' > {args.name}.txt")
         else:
             for i in store.list():
                 print(f"{i['id']}. [{'x' if i['done'] else ' '}] {i['title']}")

- id: bug-error-swallowed
  bug: true
  title: "Make `done` report a clear error for an unknown id"
  description: "`python -m todo.cli done 99` must print \"no item with id 99\" to stderr and exit with status 1."
  criteria: "- Unknown id prints \"no item with id <id>\" to stderr\n- Exit status is 1 for an unknown id"
  diff: |
    diff --git a/todo/cli.py b/todo/cli.py
    --- a/todo/cli.py
    +++ b/todo/cli.py
    @@ -21,7 +21,10 @@ def main(argv: list[str] | None = None) -> int:
         if args.cmd == "add":
             print(store.add(args.title))
         elif args.cmd == "done":
    -        store.done(args.id)
    +        try:
    +            store.done(args.id)
    +        except KeyError:
    +            pass
         else:
             for i in store.list():
                 print(f"{i['id']}. [{'x' if i['done'] else ' '}] {i['title']}")

