- id: clean-clear-command
  bug: false
  title: "Add a `clear` command that removes completed items"
  description: "`python -m todo.cli clear` deletes every item marked done and prints how many were removed. Ids of the remaining items must not change."
  criteria: "- `clear` removes only done items\n- Prints the number removed\n- Remaining ids unchanged"
  diff: |
    diff --git a/todo/store.py b/todo/store.py
    --- a/todo/store.py
    +++ b/todo/store.py
    @@ -26,6 +26,12 @@ class Store:
         def list(self) -> list[dict]:
             return list(self.items)
     
    +    def clear(self) -> int:
    +        before = len(self.items)
    +        self.items = [i for i in self.items if not i["done"]]
    +        self._save()
    +        return before - len(self.items)
    +
         def _save(self) -> None:
             self.path.write_text(json.dumps(self.items, indent=2))
    diff --git a/todo/cli.py b/todo/cli.py
    --- a/todo/cli.py
    +++ b/todo/cli.py
    @@ -13,6 +13,7 @@ def main(argv: list[str] | None = None) -> int:
         d = sub.add_parser("done")
         d.add_argument("id", type=int)
    +    sub.add_parser("clear")
         args = p.parse_args(argv)
     
         store = Store(args.file)
    @@ -20,6 +21,8 @@ def main(argv: list[str] | None = None) -> int:
             print(store.add(args.title))
         elif args.cmd == "done":
             store.done(args.id)
    +    elif args.cmd == "clear":
    +        print(store.clear())
         else:
             for i in store.list():
                 print(f"{i['id']}. [{'x' if i['done'] else ' '}] {i['title']}")
    diff --git a/tests/test_store.py b/tests/test_store.py
    --- a/tests/test_store.py
    +++ b/tests/test_store.py
    @@ -26,3 +26,12 @@ def test_items_survive_reload(tmp_path):
         Store(tmp_path / "t.json").add("a")
         assert [i["title"] for i in Store(tmp_path / "t.json").list()] == ["a"]
    +
    +
    +def test_clear_removes_only_done_and_keeps_ids(tmp_path):
    +    s = Store(tmp_path / "t.json")
    +    a, b = s.add("a"), s.add("b")
    +    s.done(a)
    +    assert s.clear() == 1
    +    assert [i["id"] for i in s.list()] == [b]
