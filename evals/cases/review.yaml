- id: bug-id-reuse
  bug: true
  title: "Simplify id generation in Store.add"
  description: "The max() over all items is noisy. Use the number of items instead."
  diff: |
    diff --git a/todo/store.py b/todo/store.py
    --- a/todo/store.py
    +++ b/todo/store.py
    @@ -12,7 +12,7 @@ class Store:
                 self.items = json.loads(self.path.read_text())
     
         def add(self, title: str) -> int:
    -        new_id = max((i["id"] for i in self.items), default=0) + 1
    +        new_id = len(self.items) + 1
             self.items.append({"id": new_id, "title": title, "done": False})
             self._save()
             return new_id

