- id: clean-json-flag
  bug: false
  title: "Add a --json flag to the list command"
  description: "`python -m todo.cli list --json` prints the items as a JSON array. Default output stays unchanged."
  criteria: "- `list --json` prints a JSON array of items\n- `list` without the flag prints the same lines as before"
  diff: |
    diff --git a/todo/cli.py b/todo/cli.py
    --- a/todo/cli.py
    +++ b/todo/cli.py
    @@ -1,4 +1,5 @@
     import argparse
    +import json
     import sys
     
     from .store import Store
    @@ -8,7 +9,8 @@ def main(argv: list[str] | None = None) -> int:
         p = argparse.ArgumentParser(prog="todo")
         p.add_argument("--file", default="todo.json")
         sub = p.add_subparsers(dest="cmd", required=True)
    -    sub.add_parser("list")
    +    ls = sub.add_parser("list")
    +    ls.add_argument("--json", action="store_true")
         a = sub.add_parser("add")
         a.add_argument("title")
         d = sub.add_parser("done")
    @@ -22,6 +24,8 @@ def main(argv: list[str] | None = None) -> int:
             print(store.add(args.title))
         elif args.cmd == "done":
             store.done(args.id)
    +    elif args.json:
    +        print(json.dumps(store.list()))
         else:
             for i in store.list():
                 print(f"{i['id']}. [{'x' if i['done'] else ' '}] {i['title']}")
    diff --git a/tests/test_cli.py b/tests/test_cli.py
    new file mode 100644
    --- /dev/null
    +++ b/tests/test_cli.py
    @@ -0,0 +1,13 @@
    +import json
    +
    +from todo.cli import main
    +
    +
    +def test_list_json(tmp_path, capsys):
    +    f = str(tmp_path / "t.json")
    +    main(["--file", f, "add", "a"])
    +    capsys.readouterr()
    +    main(["--file", f, "list", "--json"])
    +    out = json.loads(capsys.readouterr().out)
    +    assert out == [{"id": 1, "title": "a", "done": False}]

